name: foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    timeout-minutes: 30
    env:
      QT_API: pyside6
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - name: Linux desktop libraries and virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libopengl0 libxcb-cursor0 libxcb1 libx11-xcb1 libxcb-util1 libxcb-keysyms1 libxcb-image0 libxcb-shm0 libxcb-icccm4 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libnss3 libasound2t64 libgtk-3-0
      - run: uv lock --check
      - run: uv sync --frozen --extra dev --extra gui --extra server
      - run: uv pip check
      - name: Windows full quality gates
        if: runner.os == 'Windows'
        run: uv run --frozen --extra dev --extra gui python scripts/qa/run_all.py --local
      - name: Linux full quality gates under Xvfb
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen LIBGL_ALWAYS_SOFTWARE=1 QTWEBENGINE_CHROMIUM_FLAGS=--disable-gpu xvfb-run -a uv run --frozen --extra dev --extra gui python scripts/qa/run_all.py --local
      - name: Phase 1–3 clean installed regression
        run: uv run --frozen --extra dev --extra gui python scripts/check_installed_wheel.py .tools/phase4-qa/dist/mycmd-2.0.0.dev0-py3-none-any.whl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-${{ matrix.os }}
          path: |
            .tools/phase4-qa/*.log
            .tools/phase4-qa/*.json
            .tools/phase4-qa/*.md
            .tools/phase4-qa/*.xml
            .tools/phase4-visual/*.png
  portfolio:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/portfolio/package-lock.json
      - name: Install Linux browser libraries
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Windows browser
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Install locked frontend dependencies
        working-directory: apps/portfolio
        run: npm ci
      - name: TypeScript and lint
        working-directory: apps/portfolio
        run: |
          npm run typecheck
          npm run lint
      - name: Unit and component tests
        working-directory: apps/portfolio
        run: npm test
      - name: Production build
        working-directory: apps/portfolio
        run: npm run build
      - name: Desktop and mobile browser tests
        working-directory: apps/portfolio
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase5-${{ matrix.os }}
          path: |
            apps/portfolio/test-results/
            apps/portfolio/playwright-report/
            apps/portfolio/dist/
  mysql:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mycmd_test
          MYSQL_USER: mycmd
          MYSQL_PASSWORD: mycmd-test-only
          MYSQL_ROOT_PASSWORD: mycmd-root-test-only
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -umycmd -pmycmd-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check
      - run: uv sync --frozen --extra dev --extra server
      - name: Run MySQL migrations
        shell: bash
        env:
          DATABASE_URL: mysql+pymysql://mycmd:mycmd-test-only@127.0.0.1:3307/mycmd_test
        run: uv run --frozen --extra server alembic upgrade head
      - name: Run MySQL and API tests
        shell: bash
        env:
          DATABASE_URL: mysql+pymysql://mycmd:mycmd-test-only@127.0.0.1:3307/mycmd_test
          MYCMD_MYSQL_TEST_URL: mysql+pymysql://mycmd:mycmd-test-only@127.0.0.1:3307/mycmd_test
          MYCMD_SECRET_KEY: ci-phase6-secret-key-at-least-32-characters
          MYCMD_BOOTSTRAP_TOKEN: ci-phase6-bootstrap-token
        run: uv run --frozen --extra dev --extra server pytest -q tests/integration/test_mysql_server.py tests/integration/test_server.py
