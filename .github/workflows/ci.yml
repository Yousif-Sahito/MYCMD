name: foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    timeout-minutes: 30
    env:
      QT_API: pyside6
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - name: Linux desktop libraries and virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libnss3 libasound2t64
      - run: uv lock --check
      - run: uv sync --frozen --extra dev --extra gui
      - run: uv pip check
      - name: Windows full quality gates
        if: runner.os == 'Windows'
        run: uv run --frozen --extra dev --extra gui python scripts/qa/run_all.py --local
      - name: Linux full quality gates under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --frozen --extra dev --extra gui python scripts/qa/run_all.py --local
      - name: Phase 1–3 clean installed regression
        run: uv run --frozen --extra dev --extra gui python scripts/check_installed_wheel.py .tools/phase4-qa/dist/mycmd-2.0.0.dev0-py3-none-any.whl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-${{ matrix.os }}
          path: |
            .tools/phase4-qa/*.log
            .tools/phase4-qa/*.json
            .tools/phase4-qa/*.md
            .tools/phase4-qa/*.xml
            .tools/phase4-visual/*.png
