services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYCMD_MYSQL_DATABASE}
      MYSQL_USER: ${MYCMD_MYSQL_USER}
      MYSQL_PASSWORD: ${MYCMD_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYCMD_MYSQL_ROOT_PASSWORD}
    volumes:
      - mycmd-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      MYCMD_ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL}
      MYCMD_SECRET_KEY: ${MYCMD_SECRET_KEY}
      MYCMD_BOOTSTRAP_TOKEN: ${MYCMD_BOOTSTRAP_TOKEN}
      MYCMD_PUBLIC_ORIGIN: ${MYCMD_PUBLIC_ORIGIN}
    command:
      - sh
      - -c
      - "alembic upgrade head && uvicorn server.app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8000"

  portfolio:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    environment:
      MYCMD_PUBLIC_DOMAIN: ${MYCMD_PUBLIC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/portfolio/dist:/srv/portfolio:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  mycmd-mysql:
