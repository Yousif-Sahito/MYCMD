[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mycmd"
version = "2.0.0.dev0"
description = "Offline-first personal command centre with trusted local terminals"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "click>=8.5.1",
    "rich>=15.0.0",
    "typer>=0.29.1",
]

[project.scripts]
mycmd = "mycmd.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "build>=1.2,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mycmd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires external services",
    "e2e: requires target operating system and UI",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
files = ["src", "server"]
strict = true
